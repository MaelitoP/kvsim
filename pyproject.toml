[project]
name = "kvsim"
version = "0.1.0"
description = "A simulator for LLM scheduling and paged KV caches"
readme = "README.md"
license = "MIT"
authors = [{ name = "Maël Le Petit" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
kvsim = "kvsim.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.16",
    "pytest>=8.3",
    "ruff>=0.11",
    "shellcheck-py>=0.11",
]
bench = [
    "httpx>=0.28",
    "matplotlib>=3.9",
    "numpy>=2",
    "tokenizers>=0.21",
]

[tool.uv]
default-groups = ["dev", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "benchmarks"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]
mypy_path = ["tests", "benchmarks"]
